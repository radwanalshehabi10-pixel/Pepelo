const R=(()=>{/* =====================================================================

   رموز الخريطة:
     #  جدار        .  أرض         A / B  بداية Tztezo / Tztezo17

const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];          // 0 فوق، 1 يمين، 2 تحت، 3 يسار
const T = { FLOOR: 0, WALL: 1, ICE: 2, CRACK: 3, PLATE: 4, DOOR: 5, TELE: 6 };

function compile(rows) {
  const h = rows.length, w = rows[0].length;

    if (rows[y].length !== w) throw new Error('row ' + y + ' has wrong length');

      const c = rows[y][x], i = y * w + x;
      switch (c) {
        case '#': L.tile[i] = T.WALL; break;
        case '.': case ' ': break;
        case 'A': L.start[0] = i; break;
        case 'B': L.start[1] = i; break;
        case 'a': L.exit[0] = i; break;
        case 'b': L.exit[1] = i; break;
        case 'o': L.crates.push(i); break;
        case '~': L.tile[i] = T.ICE; break;
        case 'c': L.tile[i] = T.CRACK; break;
        case '1': case '2': case '3': case '4': L.tile[i] = T.PLATE; L.col[i] = +c - 1; L.plates[+c - 1].push(i); break;
        case 'Q': case 'W': case 'E': case 'R': { const k = 'QWER'.indexOf(c); L.tile[i] = T.DOOR; L.col[i] = k; L.doors[k].push(i); break; }

}

  const poll=()=>RF('_idx').once('value').then(sn=>{const v=sn.val()||{};const now=Date.now();const l=Object.keys(v).filter(k=>v[k]&&v[k].n);$('rooms').innerHTML='';
    $('join-msg').textContent=l.length?'':'No open rooms right now. Ask your friend to host!';
    l.forEach(k=>{const d=document.createElement('div');d.className='room';d.innerHTML='<span><b>'+esc(v[k].n)+'</b>\'s room · '+k+'</span>';const b=document.createElement('button');b.className='btn sm';b.textContent='Join';b.onclick=()=>requestJoin(k,v[k].n);d.appendChild(b);$('rooms').appendChild(d);});}).catch(()=>{$('join-msg').textContent='Connection problem';});
  poll();NET.pollJ=setInterval(poll,3500);};
$('join-back').onclick=()=>{clearInterval(NET.pollJ);show('menu');};
function requestJoin(code,hn){clearInterval(NET.pollJ);NET.code=code;$('join-msg').textContent='Waiting for '+hn+' to accept…';$('rooms').innerHTML='';
  RF('r/'+code+'/req/'+NET.uid).set({n:myName});RF('r/'+code+'/req/'+NET.uid).onDisconnect().remove();
  listen(RF('r/'+code+'/acc/'+NET.uid),sn=>{if(sn.val()!==true||G.mode==='guest')return;G.mode='guest';G.online=true;G.guest=true;
    RF('r/'+code+'/gp').set(1);RF('r/'+code+'/gp').onDisconnect().set(0);
    listen(RF('r/'+code+'/s'),onSnap);listen(RF('_idx/'+code),s2=>{if(s2.val()===null&&G.mode==='guest'){toast('The host left the room',3500);leaveAll();}});});
  setTimeout(()=>{if(G.mode!=='guest'&&NET.code===code){$('join-msg').textContent='No answer from the host. Try again.';NET.code='';NET.offs.forEach(f=>f());NET.offs=[];setTimeout(()=>$('b-join').onclick(),1500);}},60000);}
function onSnap(sn){const v=sn.val();if(!v)return;
  if(v.lv>=LEVELS.length){toast('Your level files are older than the host\'s. Update them.',5000);return;}
  if(v.lv<0){show('sel');$('sel-t').textContent='The host is choosing a level…';$('grid').innerHTML='';$('sel-room').textContent='You are Tztezo17';return;}
  if(v.lv!==G.lv||!G.L||!$('game').classList.contains('on')){if(v.lv!==G.lv||!G.L)loadLevel(v.lv);else{}show('game');hideWin();G.won=false;}
  const was=G.s;G.s={p:[v.a,v.b],crates:v.c||[],pits:v.x||[]};G.moves=v.m||0;updHud();
  if(was&&G.s.pits.length>was.pits.length)sfx.crack();else sfx.move();
  if(v.w&&!G.won){G.won=true;sfx.win();startWin(starsFor(G.moves,LEVELS[G.lv].par));}
  if(!v.w&&G.won){G.won=false;hideWin();}}
fit();
</script></body></html>
